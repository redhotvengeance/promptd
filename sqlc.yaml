version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/libsql/data/query.sql"
    schema: "internal/libsql/data/schema.sql"
    gen:
      go:
        package: "sql"
        out: "internal/libsql/data/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        overrides:
          - column: "document_chunks.embedding"
            go_type:
              type: "byte"
              slice: true
